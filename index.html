<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120b18" />
    <meta name="description" content="A faith journal where a pixel tree grows with every note." />
    <!-- the preview when the link is shared (Facebook, Messenger, WhatsApp, X…). The picture is
         public/og-image.png, retaken by e2e/share.shots.ts. __SITE_URL__ becomes the site's own
         address when it's built (vite.config.ts): most apps need the picture's full address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rooted" />
    <meta property="og:title" content="Rooted — a tree that grows with your walk of faith" />
    <meta
      property="og:description"
      content="A faith journal where a pixel tree grows with every note. Write about church, cell group, Bible study or prayer, in English or Tagalog."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rooted: a pink pixel-art sakura tree at sunset, beside the words “A tree that grows with your walk of faith.”" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- installable app: manifest + icons (regenerate icons with `npm run icons`) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rooted" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Rooted</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
